name: Update Blitz Portable

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      installer_url:
        description: "Blitz installer URL (leave blank to use the current download)"
        required: false
        default: "https://blitz.gg/download/win"
        type: string
      publish:
        description: "Publish the generated archive to the checked-out branch"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: update-blitz-portable
  cancel-in-progress: false

jobs:
  update-blitz:
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.MAINTAINER_PAT || github.token }}
          lfs: true

      - name: Initialize diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "blitz-portable-diagnostics") -Force | Out-Null

      - name: Push token notice
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.MAINTAINER_PAT }}")) {
            Write-Warning "MAINTAINER_PAT is not configured. If master protection blocks GITHUB_TOKEN pushes, set MAINTAINER_PAT to a maintainer PAT with repo scope."
          }

      - name: Determine update mode
        id: mode
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_INSTALLER_URL: ${{ inputs.installer_url || 'https://blitz.gg/download/win' }}
          INPUT_PUBLISH: ${{ inputs.publish || 'false' }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $isSchedule = $env:EVENT_NAME -eq "schedule"
          $manualPublish = $env:INPUT_PUBLISH -eq "true"
          $publish = $isSchedule -or $manualPublish

          if ($publish -and $env:REF_NAME -ne $env:DEFAULT_BRANCH) {
            throw "Publishing is only allowed from the default branch ($env:DEFAULT_BRANCH); current ref is $env:REF_NAME"
          }

          "installer_url=$env:INPUT_INSTALLER_URL" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publish=$($publish.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Installer URL: $env:INPUT_INSTALLER_URL"
          Write-Host "Publish mode: $publish"

      - name: Prepare portable 7-Zip 26.02
        id: seven_zip
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP "blitz-7zip-2602"
          $archive = Join-Path $env:RUNNER_TEMP "7z2602-extra.7z"
          $url = "https://www.7-zip.org/a/7z2602-extra.7z"
          $expectedSha256 = "081DF9E9311DFD9C9E0E98C1C80180B99BB51E4CB24156B5F3057FE3C259D70A"

          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "7-Zip archive hash mismatch. Expected $expectedSha256, got $actualSha256"
          }

          $system7z = $null
          foreach ($name in @("7z.exe", "7za.exe")) {
            $command = Get-Command -Name $name -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($command) {
              $system7z = $command.Source
              break
            }
          }
          if (!$system7z) {
            $programRoots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}) | Where-Object { $_ }
            foreach ($root in $programRoots) {
              foreach ($relativePath in @("7-Zip\7z.exe", "7-Zip\7za.exe")) {
                $candidate = Join-Path $root $relativePath
                if (Test-Path -LiteralPath $candidate -PathType Leaf) {
                  $system7z = $candidate
                  break
                }
              }
              if ($system7z) {
                break
              }
            }
          }
          if (!$system7z) {
            throw "The Windows runner does not expose a system 7z.exe/7za.exe to unpack the pinned tool archive"
          }

          New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null
          & $system7z x $archive "-o$toolRoot" -y | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to unpack portable 7-Zip with $system7z"
          }

          $sevenZip = Join-Path $toolRoot "7za.exe"
          if (!(Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            throw "Pinned 7-Zip archive did not contain 7za.exe"
          }

          $toolHash = (Get-FileHash -LiteralPath $sevenZip -Algorithm SHA256).Hash.ToUpperInvariant()
          Write-Host "Portable 7-Zip SHA256: $toolHash"
          "path=$sevenZip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build portable candidate
        id: build
        shell: pwsh
        env:
          INSTALLER_URL: ${{ steps.mode.outputs.installer_url }}
          PUBLISH: ${{ steps.mode.outputs.publish }}
          SEVEN_ZIP: ${{ steps.seven_zip.outputs.path }}
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP "blitz-portable-diagnostics"
          $baseline = Join-Path $PWD "Portable\blitzportable.zip"
          $output = if ($env:PUBLISH -eq "true") {
            $baseline
          }
          else {
            Join-Path $env:RUNNER_TEMP "blitzportable.candidate.zip"
          }

          $json = & "$PWD\scripts\Build-BlitzPortable.ps1" `
            -InstallerUrl $env:INSTALLER_URL `
            -OutputZip $output `
            -BaselineZip $baseline `
            -DiagnosticsDirectory $diagnostics `
            -SevenZipPath $env:SEVEN_ZIP | Out-String

          if ($LASTEXITCODE -ne 0) {
            throw "Portable build script failed. See $diagnostics"
          }

          $result = $json | ConvertFrom-Json
          if (!$result.Success) {
            throw "Portable build script did not report success"
          }

          "changed=$($result.Changed.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "output=$output" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "payload_version=$($result.PayloadVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Payload version: $($result.PayloadVersion)"
          Write-Host "Payload files: $($result.PayloadFileCount)"
          Write-Host "Content changed: $($result.Changed)"

      - name: Check for changes
        id: check_changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -- Portable/blitzportable.zip
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Changes detected"
            "has_changes=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          else {
            Write-Host "No changes detected"
            "has_changes=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Commit and push changes
        if: steps.mode.outputs.publish == 'true' && steps.check_changes.outputs.has_changes == 'true'
        shell: pwsh
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          $date = Get-Date -AsUTC -Format "yyyy-MM-dd"
          git commit -m "Update Blitz portable zip - $date"
          if ($LASTEXITCODE -ne 0) {
            throw "Commit failed"
          }

          git push origin "HEAD:$env:BRANCH"
          if ($LASTEXITCODE -ne 0) {
            throw "Push failed"
          }

          Write-Host "Changes committed and pushed to $env:BRANCH successfully"

      - name: No changes to commit
        if: steps.mode.outputs.publish != 'true' || steps.check_changes.outputs.has_changes != 'true'
        shell: pwsh
        run: |
          Write-Host "Dry-run completed or portable payload is already up to date"

      - name: Upload candidate archive
        if: ${{ always() && github.event_name == 'workflow_dispatch' && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: blitz-portable-candidate-${{ github.run_id }}
          path: ${{ steps.build.outputs.output }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

      - name: Upload manifests and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: blitz-portable-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/blitz-portable-diagnostics
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7
